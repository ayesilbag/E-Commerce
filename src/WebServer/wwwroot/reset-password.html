<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Şifre Sıfırlama</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7fb;
        color: #0f172a;
      }
      .card {
        width: min(100%, 420px);
        margin: 1rem;
        padding: 2rem;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: #64748b;
        line-height: 1.5;
      }
      label {
        display: block;
        margin-bottom: 0.35rem;
        font-size: 0.875rem;
        font-weight: 600;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 1rem;
        padding: 0.75rem 0.875rem;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font: inherit;
      }
      button {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(135deg, #5b4cdb, #7c3aed);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }
      .message {
        margin-top: 1rem;
        padding: 0.75rem 0.875rem;
        border-radius: 8px;
        font-size: 0.925rem;
        display: none;
      }
      .message.error {
        display: block;
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
      }
      .message.success {
        display: block;
        background: #ecfdf5;
        color: #047857;
        border: 1px solid #a7f3d0;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Yeni şifre belirle</h1>
      <p>E-postanızdaki bağlantı geçerlidir. Yeni şifrenizi girin.</p>

      <form id="reset-form">
        <label for="email">E-posta</label>
        <input id="email" name="email" type="email" required readonly />

        <label for="password">Yeni şifre</label>
        <input id="password" name="password" type="password" minlength="6" required />

        <label for="confirm">Yeni şifre (tekrar)</label>
        <input id="confirm" name="confirm" type="password" minlength="6" required />

        <button type="submit" id="submit">Şifremi güncelle</button>
      </form>

      <div id="message" class="message" role="status"></div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const email = params.get("email") ?? "";
      const code = params.get("code") ?? "";
      const emailInput = document.getElementById("email");
      const form = document.getElementById("reset-form");
      const message = document.getElementById("message");
      const submit = document.getElementById("submit");

      emailInput.value = email;

      function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
      }

      if (!email || !code) {
        showMessage("Geçersiz veya eksik sıfırlama bağlantısı. Lütfen e-postanızdaki bağlantıyı tekrar kullanın.", "error");
        form.style.display = "none";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;

        if (password !== confirm) {
          showMessage("Şifreler eşleşmiyor.", "error");
          return;
        }

        submit.disabled = true;
        message.className = "message";

        try {
          const response = await fetch("/resetPassword", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email,
              resetCode: code,
              newPassword: password
            })
          });

          if (response.ok) {
            showMessage("Şifreniz güncellendi. Giriş yapabilirsiniz.", "success");
            form.style.display = "none";
            return;
          }

          const data = await response.json().catch(() => null);
          const detail =
            data?.errors && typeof data.errors === "object"
              ? Object.values(data.errors).flat().join(" ")
              : null;

          showMessage(detail || "Şifre güncellenemedi. Bağlantının süresi dolmuş olabilir.", "error");
        } catch {
          showMessage("Sunucuya bağlanılamadı. Lütfen tekrar deneyin.", "error");
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
