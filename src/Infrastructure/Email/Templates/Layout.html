<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{{Heading}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#f6f7fb;font-family:'Plus Jakarta Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0f172a;-webkit-font-smoothing:antialiased;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{Preheader}}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f6f7fb;">
    <tr>
      <td align="center" style="padding:48px 16px;">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;width:100%;background-color:#ffffff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,0.06),0 1px 2px rgba(15,23,42,0.04);">
          <tr>
            <td style="padding:24px 32px;border-bottom:1px solid #e2e8f0;background-color:#ffffff;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td width="40" height="40" align="center" valign="middle" style="width:40px;height:40px;background:linear-gradient(135deg,#5b4cdb 0%,#7c3aed 50%,#a855f7 100%);border-radius:12px;font-size:18px;font-weight:700;line-height:40px;color:#ffffff;box-shadow:0 8px 32px rgba(91,76,219,0.25);">{{BrandInitial}}</td>
                  <td style="padding-left:12px;">
                    <div style="font-size:16px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;color:#0f172a;">{{BrandName}}</div>
                    <div style="margin-top:2px;font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:#94a3b8;">{{BrandTag}}</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 32px 28px;background:linear-gradient(135deg,#5b4cdb 0%,#7c3aed 50%,#a855f7 100%);">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-0.03em;color:#ffffff;">{{Heading}}</td>
                </tr>
                <tr>
                  <td style="padding-top:10px;font-size:15px;line-height:1.6;color:rgba(255,255,255,0.88);">{{Preheader}}</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 32px 8px;background-color:#ffffff;">
              <p style="margin:0 0 8px;font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-0.02em;color:#0f172a;">{{Greeting}}</p>
              <p style="margin:0 0 28px;font-size:15px;line-height:1.6;color:#94a3b8;">{{Intro}}</p>
              {{BodyHtml}}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 28px;background-color:#ffffff;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-top:1px solid #e2e8f0;">
                <tr>
                  <td style="padding-top:24px;font-size:13px;line-height:1.6;color:#94a3b8;">
                    Bu e-posta {{BrandName}} hesabınızla ilgili bir işlem sonucu gönderilmiştir.
                    Bu isteği siz yapmadıysanız bu mesajı yok sayabilirsiniz.
                  </td>
                </tr>
                <tr>
                  <td style="padding-top:16px;font-size:12px;line-height:1.5;color:#cbd5e1;">© {{Year}} {{BrandName}} · {{BrandTag}}</td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
