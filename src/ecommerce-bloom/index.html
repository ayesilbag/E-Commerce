<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9b87f5" />

    <!-- Basic Meta Tags -->
    <title>Bizdenalbizdensat - Modern E-Ticaret Platformu</title>

    <meta name="keywords" content="e-ticaret, alışveriş, kıyafet, aksesuar, online mağaza" />
    <meta name="author" content="Bizdenalbizdensat" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL (production'da güncelle) -->
    <link rel="canonical" href="https://bizdenalbizdensat.com/" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bizdenalbizdensat - Modern E-Ticaret Platformu" />
    <meta property="og:description" content="Bizdenalbizdensat ile alışveriş keyfini yaşayın. En moda kıyafetler, aksesuarlar ve daha fazlası uygun fiyatlarla." />
    <meta property="og:url" content="https://bizdenalbizdensat.com/" />
    <meta property="og:site_name" content="Bizdenalbizdensat" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:image" content="https://bizdenalbizdensat.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bizdenalbizdensat E-Ticaret" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bizdenalbizdensat - Modern E-Ticaret Platformu" />
    <meta name="twitter:description" content="Bizdenalbizdensat ile alışveriş keyfini yaşayın. En moda kıyafetler, aksesuarlar ve daha fazlası uygun fiyatlarla." />
    <meta name="twitter:image" content="https://bizdenalbizdensat.com/og-image.jpg" />
    <meta name="twitter:site" content="@bizdenalbizdensat" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Structured Data (Organization) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Bizdenalbizdensat",
      "url": "https://bizdenalbizdensat.com",
      "logo": "https://bizdenalbizdensat.com/bizden-logo.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+90-555-123-4567",
        "contactType": "customer service"
      }
    }
    </script>

    <!-- Structured Data (WebSite) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Bizdenalbizdensat",
      "url": "https://bizdenalbizdensat.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://bizdenalbizdensat.com/shop?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
